[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalshi-ws-collector"
version = "0.1.0"
description = "Production-grade WebSocket collector for Kalshi 15-minute crypto markets: order-book mirroring with sequence-gap resync, trade capture, and settlement labels."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Brian Cox" }]
requires-python = ">=3.11"
keywords = ["kalshi", "websocket", "orderbook", "market-data", "prediction-markets"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
    "Framework :: AsyncIO",
]
dependencies = [
    "websockets>=14.0",
    "httpx>=0.27",
    "cryptography>=42.0",
    "pyarrow>=16.0",
    # Provides the IANA time-zone database so PyArrow can resolve tz-aware
    # timestamps on platforms without a system one (e.g. Windows).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/briancox730/kalshi-ws-collector"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_ws_collector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
